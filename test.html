<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상용 웹사이트 템플릿</title>
    <style>
        /* 스타일 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #343a40;
            line-height: 1.6;
        }

        .container {
            width: 80%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 헤더 */
        header {
            background-color: #fff;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: #007bff;
        }

        /* 섹션 */
        section {
            margin-top: 30px;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* 배경 이미지 */
        .bg-image {
            height: 400px;
            background-size: cover;
            background-position: center;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        /* 푸터 */
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px 0;
            background-color: #343a40;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>웹사이트 제목</h1>
            <p>웹사이트 부제목 또는 간단한 설명</p>
        </div>
    </header>

    <section id="section1">
        <div class="container">
            <h2>섹션 1 제목</h2>
            <div class="bg-image" style="background-image: url('BACKGROUND_IMAGE_URL_1');"></div>
            <!-- BACKGROUND_IMAGE_URL_1: 섹션 1 배경 이미지 URL (예: 회사 건물 사진) -->
            <p>섹션 1 내용: 이 섹션에서는 회사 소개, 제품 소개 등 주요 정보를 제공합니다.</p>
            <img src="CONTENT_IMAGE_URL_1" alt="섹션 1 이미지" style="width: 100%;">
            <!-- CONTENT_IMAGE_URL_1: 섹션 1 콘텐츠 이미지 URL (예: 제품 이미지) -->
        </div>
    </section>

    <section id="section2">
        <div class="container">
            <h2>섹션 2 제목</h2>
            <div class="bg-image" style="background-image: url('BACKGROUND_IMAGE_URL_2');"></div>
            <!-- BACKGROUND_IMAGE_URL_2: 섹션 2 배경 이미지 URL (예: 서비스 소개 이미지) -->
            <p>섹션 2 내용: 이 섹션에서는 제공하는 서비스에 대한 자세한 설명을 제공합니다.</p>
            <img src="CONTENT_IMAGE_URL_2" alt="섹션 2 이미지" style="width: 100%;">
            <!-- CONTENT_IMAGE_URL_2: 섹션 2 콘텐츠 이미지 URL (예: 서비스 이용 화면 캡처) -->
        </div>
    </section>

    <section id="section3">
        <div class="container">
            <h2>섹션 3 제목</h2>
            <div class="bg-image" style="background-image: url('BACKGROUND_IMAGE_URL_3');"></div>
            <!-- BACKGROUND_IMAGE_URL_3: 섹션 3 배경 이미지 URL (예: 고객 후기 배경) -->
            <p>섹션 3 내용: 이 섹션에서는 고객 후기 또는 성공 사례를 소개합니다.</p>
            <img src="CONTENT_IMAGE_URL_3" alt="섹션 3 이미지" style="width: 100%;">
            <!-- CONTENT_IMAGE_URL_3: 섹션 3 콘텐츠 이미지 URL (예: 고객 후기 이미지) -->
        </div>
    </section>

    <section id="section4">
        <div class="container">
            <h2>섹션 4 제목</h2>
            <div class="bg-image" style="background-image: url('BACKGROUND_IMAGE_URL_4');"></div>
            <!-- BACKGROUND_IMAGE_URL_4: 섹션 4 배경 이미지 URL (예: 팀 소개 배경) -->
            <p>섹션 4 내용: 이 섹션에서는 팀 소개 또는 회사 비전을 소개합니다.</p>
            <img src="CONTENT_IMAGE_URL_4" alt="섹션 4 이미지" style="width: 100%;">
            <!-- CONTENT_IMAGE_URL_4: 섹션 4 콘텐츠 이미지 URL (예: 팀원 사진) -->
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2023 웹사이트 이름. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
