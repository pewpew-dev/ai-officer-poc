<!-- 모달 컴포넌트 -->
<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl mx-4">
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-800" id="modal-title"></h3>
                <button id="close-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div id="modal-content" class="prose prose-sm max-w-none overflow-auto max-h-96"></div>
                <div id="modal-edit-content" class="hidden">
                    <textarea id="edit-textarea" class="w-full h-64 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono"></textarea>
                </div>
                <div class="flex justify-end space-x-2">
                    <button id="save-edit-btn" class="hidden px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                        저장
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
