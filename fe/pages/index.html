<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowbang - AI 웹사이트 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/common.css">
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- 미리보기 영역 (전체 페이지 차지) -->
    <div id="preview-container" class="w-full h-screen fixed inset-0 z-0 hidden">
        <iframe id="preview-frame" class="w-full h-full border-0"></iframe>
    </div>
    
    <!-- 메인 컨텐츠 -->
    <main class="max-w-7xl mx-auto px-4 py-8 mt-8 relative z-10" id="main-content">
        <!-- 웹사이트 소개 화면 (웹사이트가 생성되지 않은 경우) -->
        <div id="empty-state-container" class="text-center py-12">
            <div class="max-w-2xl mx-auto">
                <div class="bg-white rounded-xl shadow-lg p-8">
                    <div class="mb-6">
                        <i class="fas fa-desktop text-blue-500 text-5xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Flowbang으로 웹사이트 만들기</h2>
                    <p class="text-gray-600 mb-6">AI를 활용하여 빠르고 쉽게 전문적인 웹사이트를 만들 수 있습니다. 원하는 디자인을 설명하고, AI가 코드를 생성해드립니다.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                        <div class="bg-blue-50 p-4 rounded-lg">
                            <div class="text-blue-600 text-xl mb-2">
                                <i class="fas fa-lightbulb"></i>
                            </div>
                            <h3 class="font-semibold mb-1">1. 아이디어 입력</h3>
                            <p class="text-sm text-gray-600">원하는 웹사이트를 설명하면 AI가 기획서를 작성합니다.</p>
                        </div>
                        <div class="bg-blue-50 p-4 rounded-lg">
                            <div class="text-blue-600 text-xl mb-2">
                                <i class="fas fa-code"></i>
                            </div>
                            <h3 class="font-semibold mb-1">2. 코드 생성</h3>
                            <p class="text-sm text-gray-600">기획서를 바탕으로 HTML, CSS, JavaScript 코드가 생성됩니다.</p>
                        </div>
                        <div class="bg-blue-50 p-4 rounded-lg">
                            <div class="text-blue-600 text-xl mb-2">
                                <i class="fas fa-rocket"></i>
                            </div>
                            <h3 class="font-semibold mb-1">3. 배포</h3>
                            <p class="text-sm text-gray-600">생성된 웹사이트를 즉시 배포하고 공유할 수 있습니다.</p>
                        </div>
                    </div>
                    
                    <a href="idea.html" class="inline-block bg-blue-600 text-white py-3 px-6 rounded-lg shadow-md hover:bg-blue-700 transition-colors">
                        <i class="fas fa-magic mr-2"></i>웹사이트 만들기 시작
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 프롬프트 버튼 (우측 하단) - 프롬프트 열기/닫기 기능 -->
    <button id="prompt-btn" class="fixed right-4 bottom-4 w-12 h-12 bg-blue-600 text-white rounded-full shadow-lg hover:bg-blue-700 transition-colors flex items-center justify-center z-30" title="웹사이트 개선 요청">
        <i class="fas fa-wand-magic-sparkles"></i>
    </button>

    <!-- 프롬프트 모달 (가운데 하단에 위치하도록 수정) -->
    <div id="prompt-modal" class="fixed inset-x-0 bottom-8 md:bottom-20 mx-auto z-40 w-full max-w-2xl px-2 md:px-4 opacity-80 transition-all duration-300">
        <div class="bg-white rounded-lg shadow-xl overflow-hidden border border-gray-200 relative">
            <!-- 모달 컨텐츠 -->
            <div class="p-4 space-y-3">
                <!-- 1. 입력 영역 (전체 너비) -->
                <div>
                    <textarea id="improvement-prompt" rows="4" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" placeholder="AI에게 웹사이트 개선 요구사항을 입력하세요..."></textarea>
                </div>
                
                <!-- 2. 모델 선택기와 버튼 그룹 -->
                <div class="flex items-center justify-between space-x-2">
                    <!-- AI 모델 선택기 -->
                    <div id="prompt-model-selector-container" class="flex-grow mr-2"></div>
                    
                    <!-- 버튼 그룹 (오른쪽) -->
                    <div class="flex space-x-2">
                        <!-- 뒤로 되돌리기 버튼 -->
                        <button id="revert-changes-btn" class="p-3 w-10 h-10 flex-shrink-0 flex items-center justify-center bg-gray-500 text-white rounded-full hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors duration-200 shadow-md" title="이전 상태로 되돌리기" disabled>
                            <i class="fas fa-undo-alt"></i>
                        </button>
                        
                        <!-- 앞으로 되돌리기 버튼 -->
                        <button id="forward-changes-btn" class="p-3 w-10 h-10 flex-shrink-0 flex items-center justify-center bg-gray-500 text-white rounded-full hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors duration-200 shadow-md" title="되돌린 상태에서 원래 상태로 복원" disabled>
                            <i class="fas fa-redo-alt"></i>
                        </button>
                        
                        <!-- 제출 버튼 -->
                        <button id="submit-prompt" class="p-3 w-10 h-10 flex-shrink-0 flex items-center justify-center bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-full hover:from-blue-600 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 transition-colors duration-200 shadow-md">
                            <i class="fas fa-wand-magic-sparkles"></i>
                        </button>
                    </div>
                </div>
                
                <!-- 3. 크레딧 정보와 히스토리 상태 정보 (맨 아래) -->
                <div class="flex justify-between">
                    <!-- 크레딧 정보 (왼쪽) -->
                    <div id="usage-info" class="text-sm text-gray-600 flex items-center bg-gray-50 rounded px-3 py-1.5">
                        <i class="fas fa-chart-line mr-1.5"></i>
                        <span>크레딧: <span id="usage-data" class="font-medium">로딩 중...</span></span>
                    </div>
                    
                    <!-- 히스토리 상태 정보 (오른쪽) -->
                    <div id="history-info" class="text-sm text-gray-600 flex items-center bg-gray-50 rounded px-3 py-1.5">
                        <i class="fas fa-history mr-1.5"></i>
                        <span>히스토리: <span id="history-position" class="font-medium">0/0</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 스크립트 -->
    <script type="module" src="../configs/config.js"></script>
    <script type="module" src="../scripts/common.js"></script>
    <script type="module" src="../scripts/index.js"></script>
</body>
</html>
