<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowbang - 이미지 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/common.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8 mt-8">
        <!-- 로고 및 제목 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Flowbang</h1>
            <p class="text-gray-600 mt-2">AI 기반 웹사이트 생성 도구</p>
        </div>

        <!-- 현재 사용중인 이미지 목록 -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-gray-800">사용중인 이미지</h2>
                <div class="flex space-x-2">
                    <button id="back-to-site-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        <i class="fas fa-arrow-left mr-1"></i> 사이트로 돌아가기
                    </button>
                </div>
            </div>

            <!-- 이미지 목록 (가로 스크롤) -->
            <div id="image-list-container" class="mb-8">
                <div id="image-list" class="flex overflow-x-auto py-4 px-2 gap-4 pb-6">
                    <!-- 이미지들이 여기에 동적으로 추가됩니다 -->
                    <div id="image-list-loading" class="text-center w-full py-10">
                        <i class="fas fa-spinner fa-spin text-gray-400 text-3xl mb-2"></i>
                        <p class="text-gray-500">이미지를 불러오는 중...</p>
                    </div>
                    <div id="no-images-message" class="hidden text-center w-full py-10">
                        <i class="fas fa-image text-gray-400 text-3xl mb-2"></i>
                        <p class="text-gray-500">사용중인 이미지가 없습니다.</p>
                    </div>
                </div>
            </div>

            <!-- 이미지 수정 섹션 -->
            <div id="image-editor" class="hidden">
                <h3 class="text-lg font-medium text-gray-800 border-t pt-6 mb-4">이미지 수정</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- 이미지 미리보기 -->
                    <div class="md:col-span-1 border p-2 rounded-lg shadow-sm">
                        <div id="image-preview" class="bg-gray-100 aspect-video flex items-center justify-center rounded overflow-hidden">
                            <img id="current-image" src="#" alt="현재 이미지" class="max-w-full max-h-full object-contain hidden">
                            <div id="image-placeholder" class="text-gray-400 flex flex-col items-center">
                                <i class="fas fa-image text-5xl mb-2"></i>
                                <p>이미지 미리보기</p>
                            </div>
                        </div>
                    </div>

                    <!-- 이미지 정보 -->
                    <div class="md:col-span-2">
                        <div class="space-y-4">
                            <!-- 이미지 키 -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">이미지 키</label>
                                <div class="relative">
                                    <input type="text" id="image-key" class="w-full p-2 pr-10 border border-gray-300 rounded-lg bg-gray-50" readonly>
                                    <button id="copy-key-btn" class="absolute right-2 top-2 text-gray-500 hover:text-gray-700" title="키 복사">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- 이미지 URL -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">이미지 URL</label>
                                <div class="relative">
                                    <input type="text" id="image-url" class="w-full p-2 pr-10 border border-gray-300 rounded-lg" placeholder="https://example.com/image.jpg">
                                    <button id="load-preview-btn" class="absolute right-2 top-2 text-gray-500 hover:text-gray-700" title="미리보기 불러오기">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- 이미지 설명 -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">이미지 설명</label>
                                <textarea id="image-description" rows="3" class="w-full p-2 border border-gray-300 rounded-lg" placeholder="이미지에 대한 설명을 입력하세요"></textarea>
                            </div>
                            
                            <!-- 이미지 만들기 버튼 (librarian 페이지로 이동) -->
                            <div>
                                <button id="create-image-btn" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                                    <i class="fas fa-magic mr-1"></i> 이미지 만들기
                                </button>
                                <span class="text-xs text-gray-500 ml-2">AI를 이용해 새 이미지를 만들거나 검색합니다</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 저장 버튼 -->
                <div class="border-t pt-6 mt-6 text-right">
                    <button id="save-image-btn" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                        <i class="fas fa-save mr-1"></i> 변경사항 저장
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 설정 및 스크립트 -->
    <script type="module" src="../configs/config.js"></script>
    <script type="module" src="../scripts/common.js"></script>
    <script type="module" src="../scripts/images.js"></script>
</body>
</html>
